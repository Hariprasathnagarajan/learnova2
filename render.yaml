# Learnova API - Django REST Framework backend on Render.
#
# Deploy with: Push repository to GitHub/GitLab, then create Blueprint in the
# Render dashboard (New + -> Blueprint).
#
# Requirements:
# 1. Render account (Free tier supported).
# 2. MongoDB Atlas Network Access configured to 0.0.0.0/0.
#
# Mobile API URL after deployment:
#   EXPO_PUBLIC_API_URL=https://<your-service-name>.onrender.com/api/v1

databases:
  - name: learnova-db
    databaseName: learnova
    user: learnova
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: learnova-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput && python manage.py seed_data && python manage.py sync_mongodb
    startCommand: gunicorn learnova_server.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/v1/health/
    autoDeploy: false

    envVars:
      # Injected automatically from the PostgreSQL database declared above.
      - key: DATABASE_URL
        fromDatabase:
          name: learnova-db
          property: connectionString

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      # Matches any *.onrender.com subdomain assigned to this service
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"

      - key: DB_SSL_REQUIRE
        value: "True"

      # MongoDB Atlas Database Connection
      - key: MONGO_URI
        value: "mongodb+srv://hariprasathnagarajan24_db_user:GWFbYog8F48DSRHi@cluster0.s1arftn.mongodb.net/learnova_db?retryWrites=true&w=majority"

      - key: MONGO_DB_NAME
        value: "learnova_db"

      # Web origins and CSRF handling
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:8000,http://127.0.0.1:8000,http://localhost:8081"
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,http://localhost:8000"

      - key: SECURE_SSL_REDIRECT
        value: "True"

      # Razorpay payment gateway credentials (server-side only)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      # JWT Token lifetimes
      - key: JWT_ACCESS_MINUTES
        value: "60"
      - key: JWT_REFRESH_DAYS
        value: "30"
      - key: MATERIAL_VIEWER_TTL_SECONDS
        value: "900"

    # NOTE: Render Free tier does not support persistent disks.
    # For paid plans (Starter+), persistent disks can be enabled by uncommenting:
    # disk:
    #   name: learnova-media
    #   mountPath: /var/data
    #   sizeGB: 1